services:

  mysql:
    image: mysql:8
    container_name: carrent-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carrent
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: carrent-backend
    ports:
      - "4000:4000"
    depends_on:
      - mysql

  frontend:
    build: ./frontend/carrent-frontend
    container_name: carrent-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data: